# =============================================================
# [four-leaf-AI] Modal CD Pipeline
# 경로: .github/workflows/deploy-modal.yml
#
# main 브랜치 push + CI 통과 시:
#   1. Modal CLI로 서버리스 배포
#   2. (기존 Docker/ECR/Infra 파이프라인 대체)
#
# 필요한 GitHub Secrets:
#   - MODAL_TOKEN_ID: Modal 토큰 ID
#   - MODAL_TOKEN_SECRET: Modal 토큰 시크릿
# =============================================================

name: Deploy to Modal

on:
  push:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ────────────────────────────────────────
  # Step 1: CI (Lint & Test) — 기존과 동일
  # ────────────────────────────────────────
  ci:
    name: CI — Python Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Run tests
        run: |
          if [ -d "tests" ] || find . -name "test_*.py" -not -path "./.git/*" | grep -q .; then
            pytest -v --tb=short
          else
            echo "⚠️  테스트 파일이 없습니다. 테스트를 건너뜁니다."
          fi
        env:
          APP_ENV: test
          GOOGLE_API_KEY: test-key-not-real

  # ────────────────────────────────────────
  # Step 2: Modal 서버리스 배포
  # ────────────────────────────────────────
  deploy:
    name: Deploy to Modal (Serverless)
    runs-on: ubuntu-latest
    needs: ci   # CI 통과 후에만 실행

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Modal CLI
        run: pip install modal

      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy modal_app.py

      - name: Deployment Summary
        run: |
          echo "✅ Modal 서버리스 배포 완료!"
          echo "📡 엔드포인트: https://<your-workspace>--four-leaf-ai-fastapi-app.modal.run"
          echo "🔗 Modal Dashboard: https://modal.com/apps"
