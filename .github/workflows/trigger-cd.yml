# =============================================================
# [four-leaf-AI] CD 트리거
# 경로: .github/workflows/trigger-cd.yml
#
# main 브랜치 push + CI 통과 시:
#   1. Docker 이미지 빌드 & AWS ECR push
#   2. four-leaf-infra 레포에 deploy-ai 이벤트 dispatch
# =============================================================

name: Build & Trigger CD

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: four-leaf-ai
  PYTHON_VERSION: '3.12'

jobs:
  # ────────────────────────────────────────
  # Step 1: CI (Lint & Test)
  # ────────────────────────────────────────
  ci:
    name: CI — Python Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Run tests
        run: |
          if [ -d "tests" ] || find . -name "test_*.py" -not -path "./.git/*" | grep -q .; then
            pytest -v --tb=short
          else
            echo "⚠️  테스트 파일이 없습니다. 테스트를 건너뜁니다."
          fi
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key-not-real

  # ────────────────────────────────────────
  # Step 2: Docker 빌드 & ECR push & Infra dispatch
  # ────────────────────────────────────────
  build-and-trigger:
    name: Build Docker Image & Trigger Infra CD
    runs-on: ubuntu-latest
    needs: ci   # CI 통과 후에만 실행

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest \
            .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          echo "image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT

      - name: Trigger four-leaf-infra CD
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: CapstoneDesignProject1-team9/four-leaf-infra
          event-type: deploy-ai
          client-payload: |
            {
              "image_tag": "${{ github.sha }}",
              "image_uri": "${{ steps.build.outputs.image }}",
              "registry": "${{ steps.build.outputs.registry }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
