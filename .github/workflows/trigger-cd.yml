name: Build & Trigger CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2
  IMAGE_NAME: four-leaf-ai
  PYTHON_VERSION: "3.12"

jobs:
  ci:
    name: CI — Python Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Ruff lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest -v --tb=short
        env:
          APP_ENV: test
          GOOGLE_API_KEY: test-key-not-real

  build-and-trigger:
    name: Build Docker Image & Trigger Infra CD
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/${{ env.IMAGE_NAME }}:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/${{ env.IMAGE_NAME }}:latest" \
            .
          docker push "$ECR_REGISTRY/${{ env.IMAGE_NAME }}:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/${{ env.IMAGE_NAME }}:latest"
          echo "image=$ECR_REGISTRY/${{ env.IMAGE_NAME }}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Trigger infra deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: CapstoneDesignProject1-team9/four-leaf-infra
          event-type: deploy-ai
          client-payload: |
            {
              "image_tag": "${{ github.sha }}",
              "image_uri": "${{ steps.build.outputs.image }}",
              "registry": "${{ steps.build.outputs.registry }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
