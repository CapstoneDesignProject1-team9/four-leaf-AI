# =============================================================
# [four-leaf-AI] CD 트리거
# 경로: .github/workflows/trigger-cd.yml
#
# main 브랜치 push + CI 통과 시:
#   1. Docker 이미지 빌드 & AWS ECR push
#   2. four-leaf-infra 레포에 deploy-ai 이벤트 dispatch
# =============================================================

name: Build & Trigger CD

on:
  push:
    branches: [main]

env:
  NCR_REGISTRY: my-ncr.kr.ncr.ntruss.com
  IMAGE_NAME: four-leaf-ai
  PYTHON_VERSION: '3.12'

jobs:
  # ────────────────────────────────────────
  # Step 1: CI (Lint & Test)
  # ────────────────────────────────────────
  ci:
    name: CI — Python Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Run tests
        run: |
          if [ -d "tests" ] || find . -name "test_*.py" -not -path "./.git/*" | grep -q .; then
            pytest -v --tb=short
          else
            echo "⚠️  테스트 파일이 없습니다. 테스트를 건너뜁니다."
          fi
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key-not-real

  # ────────────────────────────────────────
  # Step 2: Docker 빌드 & ECR push & Infra dispatch
  # ────────────────────────────────────────
  build-and-trigger:
    name: Build Docker Image & Trigger Infra CD
    runs-on: ubuntu-latest
    needs: ci   # CI 통과 후에만 실행

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to NCP Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NCR_REGISTRY }}
          username: ${{ secrets.NCP_ACCESS_KEY }}
          password: ${{ secrets.NCP_SECRET_KEY }}

      - name: Build and push Docker image
        id: build
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t ${{ env.NCR_REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG \
            -t ${{ env.NCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.NCR_REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG
          docker push ${{ env.NCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "image=${{ env.NCR_REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "registry=${{ env.NCR_REGISTRY }}" >> $GITHUB_OUTPUT

      - name: Trigger four-leaf-infra CD
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: CapstoneDesignProject1-team9/four-leaf-infra
          event-type: deploy-ai
          client-payload: |
            {
              "image_tag": "${{ github.sha }}",
              "image_uri": "${{ steps.build.outputs.image }}",
              "registry": "${{ steps.build.outputs.registry }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
