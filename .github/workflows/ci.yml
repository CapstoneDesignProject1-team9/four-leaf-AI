# =============================================================
# [four-leaf-AI] CI Pipeline
# 경로: .github/workflows/ci.yml
#
# 트리거: PR 생성/업데이트, main 브랜치 push
# 단계:
#   1. Python 3.12 설치
#   2. 의존성 설치
#   3. ruff lint 검사
#   4. pytest 실행 (tests/ 디렉토리 존재 시)
# =============================================================

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: AI CI (Python Lint & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Run tests
        # tests/ 디렉토리가 없으면 스킵
        run: |
          if [ -d "tests" ] || find . -name "test_*.py" -not -path "./.git/*" | grep -q .; then
            pytest -v --tb=short
          else
            echo "⚠️  테스트 파일이 없습니다. 테스트를 건너뜁니다."
          fi
        env:
          # 테스트 환경에서는 실제 API 키 불필요 (mock 사용 가정)
          APP_ENV: test
          OPENAI_API_KEY: test-key-not-real
