# =============================================================
# [four-leaf-AI] CI Pipeline
# 경로: .github/workflows/ci.yml
#
# 트리거: PR 생성/업데이트, main 브랜치 push
# 단계:
#   1. Python 3.12 설치
#   2. 의존성 설치
#   3. ruff lint + format 검사
#   4. pytest (Clova API mock으로 CI에서 실행 가능)
# =============================================================

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: AI CI (Python Lint & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Run tests (Clova API mock)
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          # Clova API는 mock으로 대체 → 실제 키 불필요
          CLOVA_API_KEY: test-key
          CLOVA_API_KEY_PRIMARY_VAL: test-key
